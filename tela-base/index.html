<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-red-700 min-h-screen">
    <main class="flex justify-center py-40">
        <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4 flex gap-5 flex-col">
            <h2 class="text-xl font-bold">Faça o seu login</h2>
            <hr class="w-40 border-t-4 border-orange-500">

            <label class="label">Seu email*</label>
            <input type="email" class="input" />

            <label class="label">Sua senha*</label>
            <input type="password" class="input" />
            <div class="lembrar-senha px-1">
                <input type="checkbox" id="lembrar" name="lembrar">
                <label for="lembrar">Lembrar senha</label>
            </div>

            <button class="btn btn-neutral bg-blue-700 rounded-xl mt-4">Entrar</button>
        </fieldset>
    </main>
</body>

</html>
